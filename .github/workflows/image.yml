name: Container image

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - run: go test -race ./...
      - run: go vet ./...
      - name: Build and smoke-test the container
        shell: bash
        run: |
          set -euo pipefail
          docker build -t snatcher:test .
          docker run -d --name snatcher-test \
            --read-only --cap-drop ALL --security-opt no-new-privileges:true \
            -p 127.0.0.1:8080:8080 \
            -e COBALT=http://127.0.0.1:9000 \
            -e API_KEY=ci-only-test-key-not-a-real-secret-00000000 \
            snatcher:test
          trap 'docker logs snatcher-test; docker rm -f snatcher-test' EXIT
          curl --fail --silent --show-error --retry 10 --retry-connrefused \
            --retry-delay 1 --max-time 5 http://127.0.0.1:8080/health
          status=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            --max-time 5 -H 'Content-Type: application/json' \
            --data '{"url":"https://example.com/video"}' http://127.0.0.1:8080/download)
          test "$status" = 401

  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image tags and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: latest=false
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=sha,format=long
            type=ref,event=pr
      - name: Build both architectures and publish
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
